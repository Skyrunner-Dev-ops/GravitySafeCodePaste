name: Improve Gravity code sanitizer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  improve-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve config and code detection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function sanitizeCode(source,map,found){')
          end = s.index('\nfunction sanitizeSql(source,map,found){', start)

          new_func = '''function sanitizeCode(source,map,found){
            let text=source;
            let m;
            const placeholder=(v)=>/^(true|false|null|undefined|sample|example|placeholder|your-|safe-|none|localhost)$/i.test(String(v).trim());
            const addValue=(v,repl,cat)=>{ const value=String(v||'').trim(); if(value && !placeholder(value)) addMap(map,value,repl,cat); };

            // Common API keys, cloud credentials and tokens.
            const tokenRules=[
              [/\\bAKIA[0-9A-Z]{16}\\b/g,'your-aws-access-key','AWS Access Key'],
              [/\\bASIA[0-9A-Z]{16}\\b/g,'your-aws-temporary-key','AWS Access Key'],
              [/\\b(?:sk_live_|sk_test_)[A-Za-z0-9_-]{16,}\\b/g,'your-api-key','API / Secret Key'],
              [/\\b(?:ghp_|github_pat_)[A-Za-z0-9_-]{20,}\\b/g,'your-github-token','API / Secret Key'],
              [/\\b(?:xox[baprs]-)[A-Za-z0-9-]{16,}\\b/g,'your-slack-token','API / Secret Key'],
              [/\\beyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\b/g,'your-jwt-token','JWT Token']
            ];
            for(const [re,repl,label] of tokenRules){ while((m=re.exec(source))){ found.secrets.push(m[0]); addValue(m[0],repl,label); } }

            // Connection strings in appsettings.json, web.config, .NET code, Java properties, etc.
            // This catches Data Source, Server, Database, Initial Catalog, User ID and Password combinations.
            const connection=/["']([^"']*(?:(?:Server|Data Source)\\s*=|Database\\s*=|Initial Catalog\\s*=)[^"']*(?:Password|Pwd)\\s*=[^"']*)["']/gi;
            while((m=connection.exec(source))){
              found.connectionParts.push(m[1]);
              addValue(m[1],'Server=your-server;Database=AppDB;User ID=app-user;Password=your-password;Connect Timeout=30;TrustServerCertificate=true;','Connection String');
            }

            // Generic sensitive configuration values: JSON, appsettings, YAML, XML-like attributes, .env and code assignments.
            const sensitiveKey=/["']?([A-Za-z0-9_.-]*(?:password|passwd|pwd|secret|secretkey|secret_key|apikey|api_key|accesskey|access_key|clientsecret|client_secret|token|auth_token|privatekey|private_key|connectionstring|connection_string|sas_token)[A-Za-z0-9_.-]*)["']?\\s*[:=]\\s*["']([^"'\\r\\n]+)["']/gi;
            while((m=sensitiveKey.exec(source))){
              const key=m[1], value=m[2];
              const repl=/(?:password|passwd|pwd)/i.test(key)?'your-password':/(?:connectionstring|connection_string)/i.test(key)?'Server=your-server;Database=AppDB;User ID=app-user;Password=your-password;':'your-secret-value';
              found.secretAssignments.push(value);
              addValue(value,repl,'Sensitive Configuration');
            }

            // Configuration URLs/endpoints, including BaseUrl/Endpoint settings and URLs embedded in code.
            const url=/https?:\\/\\/[^\\s"'<>`]+/gi;
            while((m=url.exec(source))){ found.urls.push(m[0]); addValue(m[0],'https://api.example.com/v1','URL / Endpoint'); }

            // Windows, UNC and Unix paths in quoted config/code values.
            const path=/(?:["'])(?:[A-Za-z]:\\\\|\\\\\\\\|\\/)(?:[^"'\\r\\n]+)(?:["'])/g;
            while((m=path.exec(source))){
              const raw=m[0].slice(1,-1);
              found.paths.push(raw);
              addValue(raw,raw.startsWith('C:')?'C:\\\\path\\\\to\\\\file.ext':'/path/to/data/file.ext','File Path');
            }

            // Project-specific identifiers and declared types.
            Object.entries(codeIdentifierMap).forEach(([a,b])=>{
              if(new RegExp('\\\\b'+regexEscape(a)+'\\\\b','g').test(source)) addMap(map,a,b,'Project Identifier');
            });
            const decl=/\\b(?:class|interface|record|struct|enum)\\s+([A-Z][A-Za-z0-9_]*)\\b/g;
            while((m=decl.exec(source))){
              const name=m[1]; found.types.push(name);
              if(!map.has(name)) addMap(map,name,/Dto$/i.test(name)?'SafePayloadDto':/Service$/i.test(name)?'GenericHandlerService':/Repository$/i.test(name)?'GenericRepository':/Controller$/i.test(name)?'GenericController':'Safe'+name,'Declared Type');
            }
            return text;
          }'''
          s = s[:start] + new_func + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit final change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/gravity-code-sanitizer-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/gravity-code-sanitizer-fix.yml
          git commit -m 'fix: support appsettings env and code sanitization [skip ci]'
          git push